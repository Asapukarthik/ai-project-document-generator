services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docgen-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=AI-Powered Project Documentation Generator
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
      - OLLAMA_TIMEOUT=120
      - DATABASE_URL=sqlite:///./output/app.db
      - MAX_UPLOAD_SIZE_MB=25
    volumes:
      - ./input:/app/input
      - ./output:/app/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docgen-frontend
    command: ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
